name: Secret scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without saved credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Install verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          scan_bin="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXX")"
          trap 'rm -f "$scan_bin/gitleaks.tar.gz"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scan_bin/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$scan_bin/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$scan_bin/gitleaks.tar.gz" -C "$scan_bin" gitleaks
          printf '%s\n' "$scan_bin" >> "$GITHUB_PATH"
      - name: Scan all commits introduced by this change
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SCAN_GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG_TOML: |
            [extend]
            useDefault = true
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          base_sha="$BEFORE_SHA"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            # New branches are compared with the default branch, not just their last commit.
            base_sha="$(git merge-base HEAD "origin/$DEFAULT_BRANCH" || true)"
            if [[ "$base_sha" == "$head_sha" ]]; then
              base_sha="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
          fi
          if [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$base_sha^{commit}"; then
            log_range="$base_sha..$head_sha"
          else
            # A new repository or unavailable predecessor must fail safely by scanning its history.
            log_range="--all"
          fi
          # Partial clones may need to read changed blobs from a private repository.
          # Give only this process a read-only header; never save credentials to Git config.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SCAN_GITHUB_TOKEN" | base64 -w0)"
          unset SCAN_GITHUB_TOKEN
          printf '::add-mask::%s\n' "$GIT_CONFIG_VALUE_0"
          gitleaks git . --log-opts="--diff-merges=first-parent $log_range" --redact=100 --no-banner --no-color \
            --ignore-gitleaks-allow --gitleaks-ignore-path=/dev/null
